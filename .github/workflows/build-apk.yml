name: Build Android APK

# Builds the Brahma Connect companion app (brahma-connect-android), verifies the
# merged manifest and uploads the debug APK as a workflow artifact.
#
# Every trigger below runs the exact same build job; see the note at the bottom
# of this file if you want to publish the APK to a GitHub Release as well.

on:
  push:
    branches: [main, master, 'arena/**']
    paths:
      - 'brahma-connect-android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'brahma-connect-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: # run the build on demand from the Actions tab

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PROJECT_DIR: brahma-connect-android
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError'

jobs:
  build:
    name: Assemble debug APK
    # Pinned on purpose: the moving `ubuntu-latest` label migrates to Ubuntu 26
    # in October 2026, and Android SDK/Java toolchains are validated on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show project files
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          ls -la
          ls -la gradle/wrapper

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          ls -la app/build/outputs/apk/debug/

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT2" dump badging "$APK")

          echo "### APK verification" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$BADGING" | grep -E "^(package|launchable-activity|sdkVersion|targetSdkVersion|uses-permission)" | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -E "classes.dex|resources.arsc|AndroidManifest.xml" | tee -a "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          fail() { echo "::error::$1"; exit 1; }

          SIZE=$(stat -c %s "$APK")
          DIGEST=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "::notice::APK $(basename "$APK") ${SIZE} bytes sha256 ${DIGEST} — package, activity and manifest permissions verified"

          echo "$BADGING" | grep -q "package: name='com.brahma.connect'" \
            || fail "APK package is not com.brahma.connect"
          echo "$BADGING" | grep -q "launchable-activity" \
            || fail "APK has no launchable activity"

          # The body needs these at runtime (microphone streaming, camera frames,
          # gateway socket, foreground service with the microphone type).
          for perm in RECORD_AUDIO CAMERA INTERNET POST_NOTIFICATIONS FOREGROUND_SERVICE FOREGROUND_SERVICE_MICROPHONE; do
            echo "$BADGING" | grep -q "android.permission.$perm" \
              || fail "merged manifest is missing permission $perm"
          done

          # Prove the phone-audio body is actually linked into the artifact.
          APK="$APK" python3 - <<'PY'
          import os, sys, zipfile

          apk = os.environ["APK"]
          needles = [b"PhoneAudioEngine", b"com/brahma/connect/audio"]
          with zipfile.ZipFile(apk) as archive:
              dex_names = [n for n in archive.namelist() if n.endswith(".dex")]
              found = any(all(n in archive.read(name) for n in needles) for name in dex_names)
          print(f"dex files: {dex_names}")
          print("PhoneAudioEngine linked:", found)
          sys.exit(0 if found else 1)
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: brahma-connect-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

# ---------------------------------------------------------------------------
# Publishing the APK to a GitHub Release is intentionally NOT automated here:
# the artifact below is downloadable from every run, which needs no extra
# permissions.  If you want releases, add a second workflow with:
#
#   on:
#     push:
#       tags: ['v*']
#   permissions:
#     contents: write
#   steps:
#     - uses: actions/download-artifact@v8
#       with: {name: brahma-connect-debug-apk, path: apk}
#     - uses: softprops/action-gh-release@v3
#       with: {files: apk/*.apk, generate_release_notes: true}
# ---------------------------------------------------------------------------
