name: Android build (compile check)

# Fast compile-only CI for the companion app.  Duplicate build errors are
# surfaced as GitHub annotations so failures are readable from the PR page.
# The APK-producing workflow lives in build-apk.yml.

on:
  pull_request:
    paths:
      - 'brahma-connect-android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main, master, 'arena/**']
    paths:
      - 'brahma-connect-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_PROJECT_DIR: brahma-connect-android

jobs:
  build:
    name: Compile debug sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile and assemble debug APK
        working-directory: ${{ env.ANDROID_PROJECT_DIR }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/android-build.log" ]; then
            diagnostics=$(grep -E '^e: |^w: |^\* What went wrong|^> [^T]|^Execution failed|^Could not|^Inconsistent' "$RUNNER_TEMP/android-build.log" | head -80 || true)
            diagnostics="${diagnostics//'%'/'%25'}"
            diagnostics="${diagnostics//$'\n'/'%0A'}"
            echo "::error::$diagnostics"
          fi
